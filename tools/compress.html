<script>
    const BACKEND_URL = "https://you-love-pdf-backend.onrender.com";

    const pdfFile = document.getElementById("pdfFile");
    const fileName = document.getElementById("fileName");
    const fileSize = document.getElementById("fileSize");
    const compressButton = document.getElementById("compressButton");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const progressArea = document.getElementById("processingArea");
    const progressBar = document.getElementById("progressBar");
    const progressPercentage = document.getElementById("progressPercentage");
    const progressText = document.getElementById("progressText");
    const pleaseWaitArea = document.getElementById("pleaseWaitArea");
    const downloadButton = document.getElementById("downloadButton");

    let readyDownloadUrl = null;
    let readyDownloadName = null;

    function formatSize(bytes) {
        if (bytes < 1024) return bytes.toFixed(0) + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + " KB";
        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    }

    pdfFile.addEventListener("change", function () {
        if (pdfFile.files.length === 0) return;
        const file = pdfFile.files[0];

        if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
            alert("Please select a PDF file.");
            pdfFile.value = "";
            return;
        }

        fileName.textContent = "Selected: " + file.name;
        fileSize.textContent = "Original size: " + formatSize(file.size);
        compressButton.style.display = "inline-block";
        status.textContent = "";
        result.textContent = "";
    });

    compressButton.addEventListener("click", async function () {
        if (pdfFile.files.length === 0) {
            alert("Please select a PDF file first.");
            return;
        }

        const file = pdfFile.files[0];
        compressButton.disabled = true;
        downloadButton.style.display = "none";

        if (readyDownloadUrl) {
            URL.revokeObjectURL(readyDownloadUrl);
            readyDownloadUrl = null;
        }

        progressArea.style.display = "block";
        pleaseWaitArea.style.display = "block";
        status.textContent = "";
        result.textContent = "";

        progressBar.style.width = "0%";
        progressPercentage.textContent = "0%";
        progressPercentage.style.display = "";
        document.querySelector("#processingArea .progress-track").style.display = "";
        progressText.textContent = "Preparing compression...";
        progressText.style.display = "";
        compressButton.textContent = "Compressing...";
        status.textContent = "Uploading PDF...";

        let progress = 5;
        progressBar.style.width = progress + "%";
        progressPercentage.textContent = progress + "%";

        const progressTimer = setInterval(function () {
            if (progress < 90) {
                progress += Math.max(1, Math.round((90 - progress) / 12));
                if (progress > 90) progress = 90;
                progressBar.style.width = progress + "%";
                progressPercentage.textContent = progress + "%";
                progressText.textContent = progress < 35 ? "Uploading PDF..." : "Compressing PDF...";
            }
        }, 350);

        try {
            const formData = new FormData();
            formData.append("file", file);
            status.textContent = "Compressing PDF...";

            const response = await fetch(BACKEND_URL + "/compress", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                let errorMessage = "PDF compression failed.";
                try {
                    const errorData = await response.json();
                    if (errorData.message) errorMessage = errorData.message;
                } catch (e) {}
                throw new Error(errorMessage);
            }

            status.textContent = "Preparing download...";
            const compressedBlob = await response.blob();
            clearInterval(progressTimer);

            const compressedSize = compressedBlob.size;
            readyDownloadUrl = URL.createObjectURL(compressedBlob);
            readyDownloadName = "compressed-" + file.name;

            progressBar.style.width = "100%";
            progressPercentage.textContent = "100%";
            progressText.textContent = "PDF is ready to download.";

            if (compressedSize < file.size) {
                const reduction = (((file.size - compressedSize) / file.size) * 100).toFixed(1);
                status.textContent = "Compression complete!";
                result.textContent = "Original: " + formatSize(file.size) + " → Compressed: " + formatSize(compressedSize) + " (" + reduction + "% smaller)";
            } else {
                status.textContent = "PDF processed successfully.";
                result.textContent = "The PDF could not be reduced further, so the original file was kept.";
            }

            setTimeout(function () {
                progressPercentage.style.display = "none";
                document.querySelector("#processingArea .progress-track").style.display = "none";
                progressText.style.display = "none";
                pleaseWaitArea.style.display = "none";
                downloadButton.style.display = "inline-block";
            }, 250);

        } catch (error) {
            clearInterval(progressTimer);
            progressArea.style.display = "none";
            pleaseWaitArea.style.display = "none";
            progressPercentage.style.display = "";
            document.querySelector("#processingArea .progress-track").style.display = "";
            progressText.style.display = "";
            downloadButton.style.display = "none";

            console.error("Compression error:", error);
            status.textContent = "";
            alert(error.message || "Sorry, this PDF could not be compressed.");
        }

        compressButton.disabled = false;
        compressButton.textContent = "Compress PDF";
    });

    downloadButton.addEventListener("click", function () {
        if (!readyDownloadUrl) {
            alert("Your PDF is not ready yet.");
            return;
        }

        const downloadLink = document.createElement("a");
        downloadLink.href = readyDownloadUrl;
        downloadLink.download = readyDownloadName || "compressed.pdf";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        downloadLink.remove();

        setTimeout(function () {
            if (readyDownloadUrl) {
                URL.revokeObjectURL(readyDownloadUrl);
                readyDownloadUrl = null;
            }
        }, 1500);
    });
</script>
