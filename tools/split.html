<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Split PDF - You Love PDF</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        .header {
    width: 100%;
    min-height: 70px;
    background: #e53935;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    border-bottom: 1px solid #c62828;

    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #ffffff;
}

.navbar {
    display: flex;
    gap: 30px;
}

.navbar a {
    text-decoration: none;
    color: #ffffff;
    font-size: 15px;
    transition: color 0.2s ease;
}

.navbar a:hover {
    color: #ffd6d6;
}
        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .tool-box {
            background: white;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .heading {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        .upload-area {
            display: block;
            border: 2px dashed #e63946;
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .upload-area:hover {
            background: #fff5f5;
        }

        .upload-area p {
            margin: 10px 0 0;
        }

        #pdfFile {
            display: none;
        }

        .file-info {
            margin-top: 25px;
            display: none;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            text-align: center;
        }

        .preview-section {
            display: none;
            margin-top: 30px;
        }

        .preview-title {
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .page-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 18px;
        }

        .page-card {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            background: white;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .page-card:hover {
            border-color: #e63946;
            transform: translateY(-2px);
        }

        .page-card.selected {
            border-color: #e63946;
            background: #fff5f5;
        }

        .page-card canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 5px;
            background: #eee;
        }

        .page-number {
            margin-top: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .selected-label {
            color: #e63946;
            font-size: 12px;
            margin-top: 4px;
            min-height: 14px;
        }

        .page-section {
            margin-top: 25px;
            display: none;
            text-align: left;
        }

        .page-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #pageRange {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #pageRange:focus {
            border-color: #e63946;
        }

        .hint {
            font-size: 14px;
            color: #777;
            margin-top: 8px;
        }

        #splitButton {
            margin-top: 25px;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            background: #e63946;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }

        #splitButton:hover {
            background: #c92f3b;
        }

        #splitButton:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .error {
            color: #e63946;
            margin-top: 15px;
            display: none;
            text-align: center;
        }

        @media (max-width: 768px) {
.header {
    min-height: auto;
    padding: 20px;
    flex-direction: column;
    gap: 15px;
}

.navbar {
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
}
            main {
                margin: 25px auto;
                padding: 15px;
            }

            .tool-box {
                padding: 25px 15px;
            }

            h1 {
                font-size: 28px;
            }

            header {
                padding: 20px;
            }

            .page-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">
        You Love PDF
    </div>

    <nav class="navbar">
        <a href="../index.html">Home</a>
        <a href="../index.html#about">About</a>
        <a href="../index.html#contact">Contact</a>
    </nav>

</header>

<main>
    <div class="tool-box">

        <div class="heading">
            <h1>Split PDF</h1>
            <p class="description">
                Select a PDF and choose which pages you want to extract.
            </p>
        </div>

        <label class="upload-area" for="pdfFile">
            <strong>📄 Add PDF</strong>
            <p>Click here to select your PDF file</p>
        </label>

        <input type="file" id="pdfFile" accept=".pdf,application/pdf">

        <div class="file-info" id="fileInfo"></div>

        <div class="preview-section" id="previewSection">
            <div class="preview-title">PDF Preview</div>
            <div class="page-grid" id="pageGrid"></div>
        </div>

        <div class="page-section" id="pageSection">

            <label for="pageRange">Pages to split</label>

            <input
                type="text"
                id="pageRange"
                placeholder="Example: 1-3 or 1,3,5"
            >

            <div class="hint">
                Click pages above to select them, or enter pages manually.
                Examples: 1-3, 1,3,5, or 2-6
            </div>

        </div>

        <button id="splitButton">Split PDF</button>

        <div class="error" id="errorMessage"></div>

    </div>
</main>

<script type="module">

    import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

    const pdfFile = document.getElementById("pdfFile");
    const fileInfo = document.getElementById("fileInfo");
    const previewSection = document.getElementById("previewSection");
    const pageGrid = document.getElementById("pageGrid");
    const pageSection = document.getElementById("pageSection");
    const pageRange = document.getElementById("pageRange");
    const splitButton = document.getElementById("splitButton");
    const errorMessage = document.getElementById("errorMessage");

    let selectedFile = null;
    let totalPages = 0;
    let selectedPages = new Set();

    pdfFile.addEventListener("change", async function () {

        errorMessage.style.display = "none";

        if (!pdfFile.files.length) {
            return;
        }

        selectedFile = pdfFile.files[0];
        selectedPages.clear();
        pageGrid.innerHTML = "";

        try {

            const fileBytes = await selectedFile.arrayBuffer();

            const pdfDoc = await PDFLib.PDFDocument.load(fileBytes);

            totalPages = pdfDoc.getPageCount();

            fileInfo.innerHTML =
                "<strong>" + escapeHtml(selectedFile.name) + "</strong><br>" +
                totalPages + " page" + (totalPages > 1 ? "s" : "");

            fileInfo.style.display = "block";
            previewSection.style.display = "block";
            pageSection.style.display = "block";
            splitButton.style.display = "inline-block";
            pageRange.value = "";

            await createPreviews(fileBytes);

        } catch (error) {

            console.error(error);
            selectedFile = null;

            showError("Unable to open this PDF file.");
        }
    });

    async function createPreviews(fileBytes) {

        const pdf = await pdfjsLib.getDocument({
            data: new Uint8Array(fileBytes)
        }).promise;

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

            const page = await pdf.getPage(pageNumber);

            const viewport = page.getViewport({
                scale: 0.55
            });

            const card = document.createElement("div");
            card.className = "page-card";
            card.dataset.page = pageNumber;

            const canvas = document.createElement("canvas");

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            const number = document.createElement("div");
            number.className = "page-number";
            number.textContent = "Page " + pageNumber;

            const selectedLabel = document.createElement("div");
            selectedLabel.className = "selected-label";
            selectedLabel.textContent = "";

            card.appendChild(canvas);
            card.appendChild(number);
            card.appendChild(selectedLabel);

            pageGrid.appendChild(card);

            await page.render({
                canvasContext: canvas.getContext("2d"),
                viewport: viewport
            }).promise;

            card.addEventListener("click", function () {

                if (selectedPages.has(pageNumber)) {
                    selectedPages.delete(pageNumber);
                    card.classList.remove("selected");
                    selectedLabel.textContent = "";
                } else {
                    selectedPages.add(pageNumber);
                    card.classList.add("selected");
                    selectedLabel.textContent = "✓ Selected";
                }

                updatePageRange();
            });
        }
    }

    function updatePageRange() {

        const pages = Array.from(selectedPages).sort(function(a, b) {
            return a - b;
        });

        pageRange.value = convertPagesToRanges(pages);
    }

    function convertPagesToRanges(pages) {

        if (pages.length === 0) {
            return "";
        }

        const ranges = [];
        let start = pages[0];
        let previous = pages[0];

        for (let i = 1; i < pages.length; i++) {

            if (pages[i] === previous + 1) {
                previous = pages[i];
            } else {
                ranges.push(
                    start === previous
                        ? String(start)
                        : start + "-" + previous
                );

                start = pages[i];
                previous = pages[i];
            }
        }

        ranges.push(
            start === previous
                ? String(start)
                : start + "-" + previous
        );

        return ranges.join(",");
    }

    splitButton.addEventListener("click", async function () {

        if (!selectedFile) {
            showError("Please select a PDF first.");
            return;
        }

        const rangeText = pageRange.value.trim();

        if (!rangeText) {
            showError("Please select or enter the pages.");
            return;
        }

        let pages;

        try {
            pages = parsePageRange(rangeText, totalPages);
        } catch (error) {
            showError(error.message);
            return;
        }

        if (pages.length === 0) {
            showError("Please select valid pages.");
            return;
        }

        splitButton.disabled = true;
        splitButton.textContent = "Splitting...";
        errorMessage.style.display = "none";

        try {

            const originalBytes = await selectedFile.arrayBuffer();

            const sourcePdf =
                await PDFLib.PDFDocument.load(originalBytes);

            const newPdf =
                await PDFLib.PDFDocument.create();

            const copiedPages =
                await newPdf.copyPages(sourcePdf, pages);

            copiedPages.forEach(function(page) {
                newPdf.addPage(page);
            });

            const pdfBytes = await newPdf.save();

            const blob = new Blob(
                [pdfBytes],
                { type: "application/pdf" }
            );

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download = "split.pdf";

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            URL.revokeObjectURL(url);

            splitButton.disabled = false;
            splitButton.textContent = "Split PDF";

        } catch (error) {

            console.error(error);

            showError(
                "Something went wrong while splitting the PDF."
            );

            splitButton.disabled = false;
            splitButton.textContent = "Split PDF";
        }
    });

    pageRange.addEventListener("input", function () {

        const text = pageRange.value.trim();

        document.querySelectorAll(".page-card").forEach(function(card) {
            card.classList.remove("selected");
            card.querySelector(".selected-label").textContent = "";
        });

        selectedPages.clear();

        if (!text) {
            return;
        }

        try {

            const pages = parsePageRange(text, totalPages);

            pages.forEach(function(pageIndex) {

                const pageNumber = pageIndex + 1;

                selectedPages.add(pageNumber);

                const card =
                    document.querySelector(
                        '.page-card[data-page="' + pageNumber + '"]'
                    );

                if (card) {
                    card.classList.add("selected");
                    card.querySelector(".selected-label").textContent =
                        "✓ Selected";
                }
            });

        } catch (error) {
            // The normal error will appear when Split PDF is clicked.
        }
    });

    function parsePageRange(text, total) {

        const result = new Set();
        const parts = text.split(",");

        for (let part of parts) {

            part = part.trim();

            if (!part) {
                continue;
            }

            if (part.includes("-")) {

                const range = part.split("-");

                if (range.length !== 2) {
                    throw new Error("Invalid page range.");
                }

                const start = parseInt(range[0].trim(), 10);
                const end = parseInt(range[1].trim(), 10);

                if (
                    isNaN(start) ||
                    isNaN(end) ||
                    start < 1 ||
                    end < 1 ||
                    start > total ||
                    end > total ||
                    start > end
                ) {
                    throw new Error("Invalid page range.");
                }

                for (let i = start; i <= end; i++) {
                    result.add(i - 1);
                }

            } else {

                const page = parseInt(part, 10);

                if (
                    isNaN(page) ||
                    page < 1 ||
                    page > total
                ) {
                    throw new Error(
                        "Please enter pages between 1 and " + total + "."
                    );
                }

                result.add(page - 1);
            }
        }

        return Array.from(result).sort(function(a, b) {
            return a - b;
        });
    }

    function showError(message) {

        errorMessage.textContent = message;
        errorMessage.style.display = "block";

        splitButton.disabled = false;
        splitButton.textContent = "Split PDF";
    }

    function escapeHtml(text) {

        const div = document.createElement("div");
        div.textContent = text;

        return div.innerHTML;
    }

</script>

</body>
</html>
