<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Split PDF - You Love PDF</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        type="module"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f8fa;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 20px 50px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    font-size:34px;
    margin-bottom:10px;
}

.header p{
    color:#666;
    font-size:16px;
}

.upload-box{
    background:white;
    border:2px dashed #ccc;
    border-radius:12px;
    padding:35px 20px;
    text-align:center;
    margin-bottom:25px;
}

.upload-box input{
    display:none;
}

.upload-btn{
    display:inline-block;
    background:#ff3131;
    color:white;
    padding:13px 25px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.file-name{
    margin-top:15px;
    color:#555;
    font-size:14px;
}

.tool-area{
    display:none;
    background:white;
    border-radius:12px;
    padding:25px;
    margin-top:20px;
}

.section-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.pages{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:18px;
    margin-top:20px;
}

.page-card{
    border:2px solid #ddd;
    border-radius:8px;
    padding:8px;
    cursor:pointer;
    background:#fff;
    transition:0.2s;
}

.page-card:hover{
    border-color:#ff3131;
}

.page-card.selected{
    border-color:#ff3131;
    box-shadow:0 0 0 2px rgba(255,49,49,0.15);
}

.page-card canvas{
    width:100%;
    height:auto;
    display:block;
    border-radius:4px;
}

.page-number{
    text-align:center;
    margin-top:8px;
    font-size:14px;
    font-weight:bold;
}

.range-box{
    margin-top:25px;
}

.range-box label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

.range-box input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
    outline:none;
}

.range-box input:focus{
    border-color:#ff3131;
}

.help-text{
    margin-top:7px;
    color:#777;
    font-size:13px;
}

.action-area{
    text-align:center;
    margin-top:25px;
}

.split-btn{
    border:none;
    background:#ff3131;
    color:white;
    padding:14px 35px;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.split-btn:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.status{
    margin-top:15px;
    font-size:14px;
    color:#555;
}

.back-btn{
    display:block;
    width:max-content;
    margin:35px auto 0;
    text-decoration:none;
    background:#222;
    color:white;
    padding:12px 24px;
    border-radius:7px;
    font-size:14px;
    font-weight:bold;
}

.back-btn:hover{
    background:#444;
}

@media(max-width:600px){

    .container{
        padding:20px 12px 40px;
    }

    .header h1{
        font-size:27px;
    }

    .tool-area{
        padding:18px;
    }

    .pages{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .split-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Split PDF</h1>
        <p>Extract selected pages from your PDF and create a new PDF.</p>
    </div>


    <!-- Upload -->
    <div class="upload-box">

        <label for="pdfInput" class="upload-btn">
            Select PDF
        </label>

        <input
            type="file"
            id="pdfInput"
            accept="application/pdf,.pdf"
        >

        <div class="file-name" id="fileName">
            No PDF selected
        </div>

    </div>


    <!-- Tool Area -->
    <div class="tool-area" id="toolArea">

        <div class="section-title">
            Select Pages
        </div>

        <p style="color:#666;font-size:14px;">
            Click on the pages you want to include in the new PDF.
        </p>


        <!-- Page Preview -->
        <div class="pages" id="pagesContainer"></div>


        <!-- Manual Range -->
        <div class="range-box">

            <label for="pageRange">
                Page Range
            </label>

            <input
                type="text"
                id="pageRange"
                placeholder="Example: 1-3, 5, 7-9"
            >

            <div class="help-text">
                Examples: 1-3 &nbsp; | &nbsp; 1,3,5 &nbsp; | &nbsp; 2-6
            </div>

        </div>


        <!-- Split Button -->
        <div class="action-area">

            <button
                class="split-btn"
                id="splitBtn"
            >
                Split PDF
            </button>

            <div
                class="status"
                id="status"
            ></div>

        </div>

    </div>


    <!-- Back to PDF Tools -->
    <a
        href="https://ruhit9090.github.io/"
        class="back-btn"
    >
        ← Back to PDF Tools
    </a>

</div>


<script type="module">

import * as pdfjsLib
from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


const pdfInput = document.getElementById("pdfInput");
const fileName = document.getElementById("fileName");
const toolArea = document.getElementById("toolArea");
const pagesContainer = document.getElementById("pagesContainer");
const pageRange = document.getElementById("pageRange");
const splitBtn = document.getElementById("splitBtn");
const status = document.getElementById("status");


const BACKEND_URL =
    "https://you-love-pdf-backend.onrender.com";


let selectedFile = null;
let totalPages = 0;
let selectedPages = new Set();


/* ---------------------------------
   PDF SELECT
--------------------------------- */

pdfInput.addEventListener("change", async function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    selectedFile = file;

    fileName.textContent = file.name;

    toolArea.style.display = "block";

    pagesContainer.innerHTML = "";

    pageRange.value = "";

    selectedPages.clear();

    status.textContent = "Loading PDF...";

    try{

        const arrayBuffer = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
            data: arrayBuffer
        }).promise;

        totalPages = pdf.numPages;


        for(let pageNumber = 1; pageNumber <= totalPages; pageNumber++){

            const page = await pdf.getPage(pageNumber);

            const viewport = page.getViewport({
                scale:0.7
            });


            const canvas =
                document.createElement("canvas");

            const context =
                canvas.getContext("2d");


            canvas.width = viewport.width;
            canvas.height = viewport.height;


            await page.render({
                canvasContext:context,
                viewport:viewport
            }).promise;


            const card =
                document.createElement("div");

            card.className = "page-card";


            card.innerHTML = `
                <div class="page-number">
                    Page ${pageNumber}
                </div>
            `;


            card.insertBefore(
                canvas,
                card.firstChild
            );


            card.addEventListener("click",function(){

                if(selectedPages.has(pageNumber)){

                    selectedPages.delete(pageNumber);

                    card.classList.remove("selected");

                }else{

                    selectedPages.add(pageNumber);

                    card.classList.add("selected");

                }

                updateRangeFromSelection();

            });


            pagesContainer.appendChild(card);

        }


        status.textContent =
            totalPages + " page(s) loaded.";


    }catch(error){

        console.error(error);

        status.textContent =
            "Failed to load PDF.";

    }

});


/* ---------------------------------
   PARSE PAGE RANGE
--------------------------------- */

function parsePageRange(value){

    const pages = new Set();

    if(!value.trim()){
        return [];
    }


    const parts =
        value.split(",");


    for(const part of parts){

        const item =
            part.trim();


        if(!item){
            continue;
        }


        if(item.includes("-")){

            const range =
                item.split("-");


            if(range.length !== 2){
                continue;
            }


            const start =
                parseInt(range[0].trim());


            const end =
                parseInt(range[1].trim());


            if(
                Number.isNaN(start) ||
                Number.isNaN(end)
            ){
                continue;
            }


            const min =
                Math.min(start,end);

            const max =
                Math.max(start,end);


            for(
                let i = min;
                i <= max;
                i++
            ){

                if(
                    i >= 1 &&
                    i <= totalPages
                ){
                    pages.add(i);
                }

            }

        }else{

            const page =
                parseInt(item);


            if(
                !Number.isNaN(page) &&
                page >= 1 &&
                page <= totalPages
            ){
                pages.add(page);
            }

        }

    }


    return Array.from(pages).sort(
        (a,b) => a-b
    );

}


/* ---------------------------------
   UPDATE VISUAL SELECTION
--------------------------------- */

function updateVisualSelection(){

    const cards =
        pagesContainer.querySelectorAll(
            ".page-card"
        );


    cards.forEach((card,index)=>{

        const pageNumber =
            index + 1;


        if(selectedPages.has(pageNumber)){

            card.classList.add("selected");

        }else{

            card.classList.remove("selected");

        }

    });

}


/* ---------------------------------
   UPDATE RANGE FROM CLICK SELECTION
--------------------------------- */

function updateRangeFromSelection(){

    const pages =
        Array.from(selectedPages).sort(
            (a,b)=>a-b
        );


    if(pages.length === 0){

        pageRange.value = "";

        return;

    }


    pageRange.value =
        pages.join(",");

}


/* ---------------------------------
   MANUAL RANGE INPUT
--------------------------------- */

pageRange.addEventListener(
    "input",
    function(){

        const pages =
            parsePageRange(this.value);


        selectedPages =
            new Set(pages);


        updateVisualSelection();

    }
);


/* ---------------------------------
   SPLIT PDF
--------------------------------- */

splitBtn.addEventListener(
    "click",
    async function(){

        if(!selectedFile){

            alert("Please select a PDF first.");

            return;

        }


        const pages =
            parsePageRange(pageRange.value);


        if(pages.length === 0){

            alert(
                "Please select at least one page."
            );

            return;

        }


        splitBtn.disabled = true;

        status.textContent =
            "Splitting PDF... Please wait.";


        try{

            const formData =
                new FormData();


            formData.append(
                "file",
                selectedFile
            );


            formData.append(
                "pages",
                JSON.stringify(pages)
            );


            const response =
                await fetch(
                    BACKEND_URL + "/split",
                    {
                        method:"POST",
                        body:formData
                    }
                );


            if(!response.ok){

                let message =
                    "PDF splitting failed.";

                try{

                    const errorData =
                        await response.json();

                    if(errorData.message){
                        message =
                            errorData.message;
                    }

                }catch(e){}

                throw new Error(message);

            }


            const blob =
                await response.blob();


            const url =
                URL.createObjectURL(blob);


            const a =
                document.createElement("a");

            a.href = url;

            a.download =
                "split.pdf";

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);


            status.textContent =
                "PDF split successfully!";


        }catch(error){

            console.error(error);

            status.textContent =
                error.message ||
                "PDF splitting failed.";

            alert(
                error.message ||
                "PDF splitting failed. Please try again."
            );

        }


        splitBtn.disabled = false;

    }
);

</script>

</body>
</html>
