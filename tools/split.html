```
<header class="header">

    <div class="logo">
        You Love PDF
    </div>

    <nav class="navbar">
        <a href="../index.html">Home</a>
        <a href="../index.html#about">About</a>
        <a href="../index.html#contact">Contact</a>
    </nav>

</header>


<main class="container">

    <h1>Split PDF</h1>

    <p class="description">
        Extract selected pages from your PDF and create a new PDF.
    </p>


    <div class="upload-box">

        <div class="upload-icon">📄</div>

        <h2>Select a PDF file</h2>

        <p>
            Choose a PDF from your computer to split.
        </p>


        <label for="pdfFile" class="upload-button">
            Select PDF
        </label>

        <input
            type="file"
            id="pdfFile"
            accept=".pdf,application/pdf"
        >


        <div id="fileName"></div>

        <div id="fileSize"></div>


        <div class="range-section">

            <label for="pageRange">
                Select Pages
            </label>

            <input
                type="text"
                id="pageRange"
                placeholder="Example: 1-3, 5, 7-9"
            >

            <div class="range-help">
                Examples: 1-3 &nbsp; | &nbsp; 1,3,5 &nbsp; | &nbsp; 2-6
            </div>

        </div>


        <div class="pages-title">
            PDF Pages
        </div>


        <div
            class="pages-container"
            id="pagesContainer"
        ></div>


        <button id="splitButton">
            Split PDF
        </button>


        <div id="status"></div>

    </div>


    <!-- Same working path as Compress PDF -->
    <a href="../index.html" class="back-button">
        ← Back to PDF Tools
    </a>

</main>


<script type="module">

    import * as pdfjsLib
        from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


    // Your Render backend
    const BACKEND_URL =
        "https://you-love-pdf-backend.onrender.com";


    const pdfFile =
        document.getElementById("pdfFile");

    const fileName =
        document.getElementById("fileName");

    const fileSize =
        document.getElementById("fileSize");

    const pageRange =
        document.getElementById("pageRange");

    const pagesContainer =
        document.getElementById("pagesContainer");

    const splitButton =
        document.getElementById("splitButton");

    const status =
        document.getElementById("status");


    let selectedFile = null;

    let totalPages = 0;

    let selectedPages = new Set();


    function formatSize(bytes) {

        if (bytes < 1024) {
            return bytes.toFixed(0) + " B";
        }

        if (bytes < 1024 * 1024) {
            return (bytes / 1024).toFixed(2) + " KB";
        }

        return (bytes / (1024 * 1024)).toFixed(2) + " MB";
    }


    /* -------------------------------
       PDF SELECT
    -------------------------------- */

    pdfFile.addEventListener(
        "change",
        async function () {

            if (pdfFile.files.length === 0) {
                return;
            }


            selectedFile =
                pdfFile.files[0];


            if (
                selectedFile.type !== "application/pdf" &&
                !selectedFile.name
                    .toLowerCase()
                    .endsWith(".pdf")
            ) {

                alert(
                    "Please select a PDF file."
                );

                pdfFile.value = "";

                return;
            }


            fileName.textContent =
                "Selected: " +
                selectedFile.name;


            fileSize.textContent =
                "File size: " +
                formatSize(selectedFile.size);


            pagesContainer.innerHTML = "";

            pageRange.value = "";

            selectedPages.clear();

            splitButton.style.display =
                "inline-block";


            status.textContent =
                "Loading PDF pages...";


            try {

                const arrayBuffer =
                    await selectedFile.arrayBuffer();


                const pdf =
                    await pdfjsLib
                        .getDocument({
                            data: arrayBuffer
                        })
                        .promise;


                totalPages =
                    pdf.numPages;


                for (
                    let pageNumber = 1;
                    pageNumber <= totalPages;
                    pageNumber++
                ) {

                    const page =
                        await pdf.getPage(
                            pageNumber
                        );


                    const viewport =
                        page.getViewport({
                            scale: 0.7
                        });


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    const context =
                        canvas.getContext("2d");


                    canvas.width =
                        viewport.width;

                    canvas.height =
                        viewport.height;


                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "page-card";


                    card.innerHTML = `
                        <div class="page-number">
                            Page ${pageNumber}
                        </div>
                    `;


                    card.insertBefore(
                        canvas,
                        card.firstChild
                    );


                    card.addEventListener(
                        "click",
                        function () {

                            if (
                                selectedPages
                                    .has(pageNumber)
                            ) {

                                selectedPages
                                    .delete(pageNumber);

                                card.classList
                                    .remove("selected");

                            } else {

                                selectedPages
                                    .add(pageNumber);

                                card.classList
                                    .add("selected");
                            }


                            updateRangeFromSelection();

                        }
                    );


                    pagesContainer.appendChild(
                        card
                    );

                }


                status.textContent =
                    totalPages +
                    " page(s) loaded. Select the pages you want to split.";


            } catch (error) {

                console.error(
                    "PDF loading error:",
                    error
                );


                status.textContent = "";

                alert(
                    "Could not load this PDF."
                );

            }

        }
    );


    /* -------------------------------
       PARSE PAGE RANGE
    -------------------------------- */

    function parsePageRange(value) {

        const pages =
            new Set();


        if (!value.trim()) {
            return [];
        }


        const parts =
            value.split(",");


        for (const part of parts) {

            const item =
                part.trim();


            if (!item) {
                continue;
            }


            if (item.includes("-")) {

                const range =
                    item.split("-");


                if (range.length !== 2) {
                    continue;
                }


                const start =
                    parseInt(
                        range[0].trim()
                    );


                const end =
                    parseInt(
                        range[1].trim()
                    );


                if (
                    Number.isNaN(start) ||
                    Number.isNaN(end)
                ) {
                    continue;
                }


                const min =
                    Math.min(
                        start,
                        end
                    );


                const max =
                    Math.max(
                        start,
                        end
                    );


                for (
                    let i = min;
                    i <= max;
                    i++
                ) {

                    if (
                        i >= 1 &&
                        i <= totalPages
                    ) {

                        pages.add(i);

                    }

                }

            } else {

                const page =
                    parseInt(item);


                if (
                    !Number.isNaN(page) &&
                    page >= 1 &&
                    page <= totalPages
                ) {

                    pages.add(page);

                }

            }

        }


        return Array
            .from(pages)
            .sort(
                (a, b) => a - b
            );

    }


    /* -------------------------------
       UPDATE PAGE SELECTION
    -------------------------------- */

    function updateVisualSelection() {

        const cards =
            pagesContainer
                .querySelectorAll(
                    ".page-card"
                );


        cards.forEach(
            (card, index) => {

                const pageNumber =
                    index + 1;


                if (
                    selectedPages
                        .has(pageNumber)
                ) {

                    card.classList
                        .add("selected");

                } else {

                    card.classList
                        .remove("selected");

                }

            }
        );

    }


    /* -------------------------------
       UPDATE RANGE
    -------------------------------- */

    function updateRangeFromSelection() {

        const pages =
            Array
                .from(selectedPages)
                .sort(
                    (a, b) => a - b
                );


        pageRange.value =
            pages.join(",");

    }


    /* -------------------------------
       MANUAL PAGE RANGE
    -------------------------------- */

    pageRange.addEventListener(
        "input",
        function () {

            const pages =
                parsePageRange(
                    pageRange.value
                );


            selectedPages =
                new Set(pages);


            updateVisualSelection();

        }
    );


    /* -------------------------------
       SPLIT PDF
    -------------------------------- */

    splitButton.addEventListener(
        "click",
        async function () {

            if (!selectedFile) {

                alert(
                    "Please select a PDF file first."
                );

                return;
            }


            const pages =
                parsePageRange(
                    pageRange.value
                );


            if (pages.length === 0) {

                alert(
                    "Please select at least one page."
                );

                return;
            }


            splitButton.disabled =
                true;


            splitButton.textContent =
                "Splitting...";


            status.textContent =
                "Uploading and splitting PDF...";


            try {

                const formData =
                    new FormData();


                formData.append(
                    "file",
                    selectedFile
                );


                formData.append(
                    "pages",
                    JSON.stringify(pages)
                );


                const response =
                    await fetch(
                        BACKEND_URL + "/split",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                if (!response.ok) {

                    let errorMessage =
                        "PDF splitting failed.";


                    try {

                        const errorData =
                            await response.json();


                        if (
                            errorData.message
                        ) {

                            errorMessage =
                                errorData.message;

                        }

                    } catch (e) {

                        // Ignore JSON parsing error

                    }


                    throw new Error(
                        errorMessage
                    );

                }


                status.textContent =
                    "Preparing download...";


                const splitBlob =
                    await response.blob();


                const downloadUrl =
                    URL.createObjectURL(
                        splitBlob
                    );


                const downloadLink =
                    document.createElement(
                        "a"
                    );


                downloadLink.href =
                    downloadUrl;


                downloadLink.download =
                    "split.pdf";


                document.body.appendChild(
                    downloadLink
                );


                downloadLink.click();


                document.body.removeChild(
                    downloadLink
                );


                URL.revokeObjectURL(
                    downloadUrl
                );


                status.textContent =
                    "PDF split successfully!";


            } catch (error) {

                console.error(
                    "Split error:",
                    error
                );


                status.textContent = "";


                alert(
                    error.message ||
                    "Sorry, this PDF could not be split."
                );

            }


            splitButton.disabled =
                false;


            splitButton.textContent =
                "Split PDF";

        }
    );

</script>
